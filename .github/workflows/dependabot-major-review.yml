name: Dependabot major review

# A green build says nothing about whether the scene still looks right, which
# is why majors used to wait for a human. This workflow answers that question
# instead: it builds the site twice (base branch vs the bump), diffs every key
# route on desktop and mobile, and drives the real interactions in a browser.
#
# Pass, and the major earns auto-merge — GitHub still holds it until the
# required "build" check is green, so both halves must agree. Fail, and it
# waits for a human with diff images attached.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: major-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Who OPENED the PR, not who pushed last: a human asking for a rebase
    # ("@dependabot rebase") makes that push their own, and gating on the actor
    # would silently disable the whole review for exactly the PRs someone is
    # paying attention to.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      review: ${{ steps.decide.outputs.review }}
      major: ${{ steps.decide.outputs.major }}
      npm: ${{ steps.decide.outputs.npm }}
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Two builds cost ~10 minutes, so they are spent only where a major could
      # plausibly change what a visitor sees. Skipped: anything that never
      # reaches the browser (types, lint, tests, build tooling that only reads
      # code) and anything used solely by the offline pipelines. NOT skipped:
      # the CSS/minification pipeline (cssnano, terser, *-loader, webpack) and
      # sharp — those shape the emitted output and can absolutely move pixels.
      - name: Decide whether a UX review is warranted
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          # Patch and minor are none of this workflow's business: they are
          # grouped, reviewed and auto-merged by dependabot-auto-merge.yml.
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            echo "major=false" >> "$GITHUB_OUTPUT"
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "npm=false" >> "$GITHUB_OUTPUT"
            echo "Not a major — nothing to do."
            exit 0
          fi
          echo "major=true" >> "$GITHUB_OUTPUT"

          if [ "$ECOSYSTEM" != "npm_and_yarn" ]; then
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "npm=false" >> "$GITHUB_OUTPUT"
            echo "An action bump cannot change how the site looks — but nothing"
            echo "here exercises the workflows either, so it waits for a human."
            exit 0
          fi
          echo "npm=true" >> "$GITHUB_OUTPUT"

          review=false
          for name in ${NAMES//,/ }; do
            case "$name" in
              # Type declarations — erased before anything runs.
              @types/*) skip="type declarations" ;;
              # Type checking and linting — never part of the bundle.
              typescript|eslint|eslint-*|@eslint/*) skip="typecheck/lint only" ;;
              # Test tooling — the test suite is its own CI gate.
              vitest|@vitest/*|@vitejs/plugin-react|jsdom|@testing-library/*) skip="test tooling" ;;
              # This checker itself, plus the bundle analyser.
              playwright|@playwright/*|pixelmatch|pngjs|@next/bundle-analyzer) skip="dev tooling" ;;
              # Offline pipelines: transcription, dubbing, Firestore export.
              @anthropic-ai/sdk|firebase-admin) skip="offline pipeline only" ;;
              *) skip="" ;;
            esac
            if [ -n "$skip" ]; then
              echo "· $name — skipped ($skip)"
            else
              echo "· $name — reaches the browser, reviewing"
              review=true
            fi
          done

          echo "review=$review" >> "$GITHUB_OUTPUT"

  ux-review:
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Auto-merge, once enabled, completes on the required "build" check alone.
      # A rebase therefore re-runs this review but does not wait for it: the PR
      # can land on the strength of a review of an older base while the fresh
      # one is still building — cssnano did exactly that. Disarm on the way in
      # and re-arm only on a pass, so the authorisation always describes the
      # code being merged.
      - name: Withdraw any previous authorisation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --disable-auto "$PR_URL" || echo "no auto-merge was enabled"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install yarn
        run: npm install -g yarn@1.22.22

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: playwright-

      - name: Install dependencies (candidate)
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build candidate
        run: yarn build

      - name: Stash candidate export
        run: mv out out-head

      # The baseline is built from the PR's merge base with the same commands,
      # in a worktree with its own node_modules, so the only difference between
      # the two exports is the dependency bump itself.
      - name: Build baseline
        run: |
          git worktree add ../baseline ${{ github.event.pull_request.base.sha }}
          cd ../baseline
          yarn install --frozen-lockfile
          yarn build
          mv out "$GITHUB_WORKSPACE/out-base"

      - name: UX check
        id: ux
        run: yarn ux-check --head out-head --base out-base --report ux-report

      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-report
          path: ux-report
          retention-days: 14

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ ! -f ux-report/summary.md ]; then
            echo "## UX check" > ux-report/summary.md
            echo "" >> ux-report/summary.md
            echo "The check did not produce a report — see the job log." >> ux-report/summary.md
          fi
          {
            cat ux-report/summary.md
            echo ""
            echo "_Screenshots and diff images are attached to this run as the \`ux-report\` artifact._"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # Commenting needs a write-scoped token; the step summary above is
          # always there as a fallback, so a failure here must not fail the job.
          gh pr comment "$PR_URL" --body-file comment.md --edit-last \
            || gh pr comment "$PR_URL" --body-file comment.md \
            || echo "Could not comment on the PR — see the job summary."

      # The site still looks and behaves as it did, so this major has run out
      # of reasons to wait for a human. --auto hands it to GitHub, which holds
      # the merge until the required "build" check (lint + tests + build) is
      # green — so both halves have to agree before anything lands.
      - name: Enable auto-merge
        if: steps.ux.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  # npm majors the review skips (types, lint, test and dev tooling, offline
  # pipelines) have no UX to inspect — for those the required "build" check is
  # the whole story.
  #
  # GitHub Actions majors are excluded on purpose, even though they are just as
  # invisible to a visitor: several of them are the actions this very workflow
  # runs on, and nothing in CI exercises a workflow file. Auto-merging those
  # would land a change to the reviewer with no way to notice it broke until
  # the next npm major failed confusingly.
  auto-merge-unreviewed:
    needs: gate
    if: needs.gate.outputs.major == 'true' && needs.gate.outputs.review == 'false' && needs.gate.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
