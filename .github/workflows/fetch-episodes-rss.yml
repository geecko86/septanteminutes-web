name: Fetch episodes RSS

on:
  schedule:
    # Runs hourly; the guard job below only lets it proceed every 3 hours in
    # Europe/Brussels local time (DST-aware). 10 minutes before
    # update-episodes.yml's equivalent guard, giving the Cloud Function's
    # indeterminate run time room to finish.
    # Months are here as well as in the guard so July and August schedule
    # nothing at all, rather than starting a runner 24 times a day to read the
    # clock and quit. Cron is evaluated in UTC, so the guard still owns the
    # month boundary — the last hours of 30 June are already July in Brussels.
    - cron: '20 * * 1-6,9-12 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          read -r month hour <<< "$(TZ='Europe/Brussels' date '+%m %H')"
          # The show does not publish over the summer, so there is nothing to
          # sync. workflow_dispatch still runs — see the job condition below.
          if [ "$month" = "08" ] || [ "$month" = "07" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Summer break — no episodes expected in month $month."
          elif [ $((10#$hour % 3)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: guard
    if: github.event_name == 'workflow_dispatch' || needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Outside the checkout: nothing here commits, but a key in the working
      # tree is a habit worth not having.
      - name: Write RSS trigger service account key
        run: echo "${RSS_TRIGGER_SA}" > "${RUNNER_TEMP}/rss-trigger-sa.json"
        env:
          RSS_TRIGGER_SA: ${{ secrets.RSS_TRIGGER_SA }}

      - name: Trigger RSS -> Firestore sync
        run: bash scripts/fetch-episodes-rss.sh
        env:
          RSS_TRIGGER_KEY_FILE: ${{ runner.temp }}/rss-trigger-sa.json

      - name: Clean up credential file
        if: always()
        run: rm -f "${RUNNER_TEMP}/rss-trigger-sa.json"
