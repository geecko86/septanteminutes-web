name: Update stale Dependabot PRs

# main requires branches to be up to date before merging (branch protection,
# strict mode), so every merge leaves the other open PRs BEHIND. Nothing
# resolves that on its own: GitHub's auto-merge waits rather than updating the
# branch, and Dependabot only revisits a PR on conflict or on its weekly
# schedule. A green, auto-merge-armed PR can therefore sit for days needing a
# nudge no one gives it.
#
# This is that nudge, once a day. Updating the branch re-runs the required
# build check (and the UX review for npm majors) against current main, which is
# the guarantee strict mode exists to provide.

on:
  # The real trigger: main moving is exactly what leaves PRs behind, and one
  # merge re-strands every other open PR. On a nightly-only schedule a queue of
  # three would drain at one PR per night; reacting to the push drains it in one
  # pass, each PR still validated against the main it will land on.
  push:
    branches: [main]
  schedule:
    # Backstop for anything the push path missed. 02:00 Europe/Brussels in
    # summer; cron is UTC and has no DST, so it drifts to 01:00 local in winter.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update every Dependabot PR that is behind main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # mergeStateStatus is computed lazily: GitHub answers UNKNOWN until it
          # has worked the mergeability out, and asking is what starts the work.
          # A PR still UNKNOWN when we filter looks identical to one that is up
          # to date, so it gets silently skipped and waits for the next sweep —
          # poll until every PR has a real answer.
          for attempt in 1 2 3 4 5 6; do
            prs=$(gh pr list --state open --author 'app/dependabot' \
              --json number,mergeStateStatus)
            unknown=$(echo "$prs" | jq '[.[] | select(.mergeStateStatus == "UNKNOWN")] | length')
            [ "$unknown" = "0" ] && break
            echo "waiting on GitHub to compute mergeability ($unknown pending, attempt $attempt)"
            sleep 15
          done
          echo "$prs" | jq -r '.[] | "  #\(.number): \(.mergeStateStatus)"'

          behind=$(echo "$prs" | jq -r '[.[] | select(.mergeStateStatus == "BEHIND") | .number] | .[]')

          if [ -z "$behind" ]; then
            echo "No Dependabot PR is behind main."
            exit 0
          fi

          for pr in $behind; do
            # Ask Dependabot to rebase rather than calling `gh pr update-branch`.
            # update-branch writes a merge commit authored by github-actions,
            # and runs triggered by that actor sit in the "workflows awaiting
            # approval" gate — the sweep would replace one manual nudge with
            # another. A Dependabot-authored push runs unattended.
            #
            # This is only safe because the dependency workflows gate on the PR
            # author: a rebase reassigns github.actor to whoever asked.
            if gh pr comment "$pr" --body '@dependabot rebase' >/dev/null; then
              echo "· #$pr — rebase requested from Dependabot"
            else
              echo "· #$pr — could not ask for a rebase; leaving it"
            fi
          done
