name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    # Who OPENED the PR, not who pushed last — a human "@dependabot rebase"
    # reassigns the actor and would skip the merge for that PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # A merge pushed with GITHUB_TOKEN spawns no workflow runs at all, which
      # silently disabled both things that are supposed to happen after a
      # dependency lands: CI never rebuilt main, and deploy-security.yml never
      # shipped a security fix — it only ever fired for PRs merged by hand.
      # This App installation token is a real actor, so the downstream triggers
      # behave. It is minted per run and expires in an hour, unlike a PAT.
      - name: Mint a merge token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Grouped PRs report the HIGHEST update-type of the group, so a
      # minor+patch maintenance group qualifies. Auto-merge only completes once
      # the required "build" status check (lint + tests + build) is green.
      # Majors are handled by dependabot-major-review.yml, which enables
      # auto-merge only after a visual + interaction review of the built site.
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
