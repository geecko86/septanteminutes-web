name: UX self-check

# Runs the interaction flows in scripts/ux-check.mjs on a GitHub runner, with no
# baseline and no pull request — the point is not to compare two builds but to
# answer "does the harness still work here?".
#
# Worth having because the flows have failed on a runner while passing on a
# laptop: a fresh checkout exports without public/api/buildId.txt, which broke
# the vinyls worker and killed the album flows in CI only. Now that a flow
# broken on the base build fails the dependency review outright, a silently
# degraded harness blocks every npm major — so this is the button to press when
# the checker itself is suspect, rather than waiting to find out on a PR.

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Ref to compare against. Blank runs the flows only; any ref also exercises the two-build visual comparison the dependency review depends on.'
        required: false
        default: 'HEAD~1'

permissions:
  contents: read

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install yarn
        run: npm install -g yarn@1.22.22

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: playwright-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: yarn build

      - name: Stash the build
        run: mv out out-head

      # Same worktree-plus-its-own-node_modules shape the dependency review
      # uses, so this exercises that path too and not just the comparison.
      - name: Build the baseline
        if: inputs.baseline != ''
        run: |
          git worktree add ../baseline "${{ inputs.baseline }}"
          cd ../baseline
          yarn install --frozen-lockfile
          yarn build
          mv out "$GITHUB_WORKSPACE/out-base"

      - name: Compare, or run the flows alone
        run: |
          if [ -d out-base ]; then
            yarn ux-check --head out-head --base out-base --report ux-report
          else
            yarn ux-check --head out-head --report ux-report
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-self-check
          path: ux-report
          retention-days: 7
