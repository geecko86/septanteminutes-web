name: CI

on:
  pull_request:
    branches: [main]
  # main no longer requires PRs to be up to date before merging — that setting
  # deadlocked every queue of open dependency PRs, and a merge queue (the
  # proper fix) needs an organization-owned repo. So two bumps that are each
  # green can now land without ever having been built together. Building main
  # after every push is what catches that, one merge later instead of never.
  push:
    branches: [main]

# This job builds and tests code from pull requests, including forks. The
# repository default is already read-only, but that is a setting someone can
# change; a workflow that runs untrusted code should not depend on it.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # Gate for Dependabot auto-merge: a dependency bump that breaks the
      # test suite must block the merge, not travel silently to the next
      # episode deploy.
      - name: Test
        run: yarn test --run

      - name: Build
        run: yarn build
