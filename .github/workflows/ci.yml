name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # Gate for Dependabot auto-merge: a dependency bump that breaks the
      # test suite must block the merge, not travel silently to the next
      # episode deploy.
      - name: Test
        run: yarn test --run

      - name: Build
        run: yarn build
