name: CI

on:
  pull_request:
    branches: [main]
  # The merge queue validates each entry against main plus everything queued
  # ahead of it, and reports under this same "build" check. Without this
  # trigger the queue would wait forever for a check that never starts.
  merge_group:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # Gate for Dependabot auto-merge: a dependency bump that breaks the
      # test suite must block the merge, not travel silently to the next
      # episode deploy.
      - name: Test
        run: yarn test --run

      - name: Build
        run: yarn build
