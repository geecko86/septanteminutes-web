name: Update episodes & deploy

on:
  schedule:
    # Declared hourly to land ~8 real runs a day. GitHub drops most scheduled
    # triggers under load: of 16 declared daily (the old DST pair), only 4-7
    # arrived, and the guard discarded about half of those as the wrong offset
    # -- roughly 2-3 effective checks a day instead of 8. One cron in UTC means
    # every delivered trigger now does work. The poll time drifts an hour
    # across DST, which does not matter for an RSS check, and a run with
    # nothing new exits in well under a minute. Actions is free on this public
    # repo, so over-declaring costs nothing.
    - cron: '30 * * 1-6,9-12 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: episode-update
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          month=$(TZ='Europe/Brussels' date '+%m')
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$month" = "07" ] || [ "$month" = "08" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Summer break — no episodes expected in month $month."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  update-episodes:
    needs: guard
    if: github.event_name == 'workflow_dispatch' || needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The HTTPS function responds only after all Firestore writes complete.
      # Running it in this job guarantees the export below sees the synced feed.
      - name: Write RSS trigger service account key
        run: echo "${RSS_TRIGGER_SA}" > "${RUNNER_TEMP}/rss-trigger-sa.json"
        env:
          RSS_TRIGGER_SA: ${{ secrets.RSS_TRIGGER_SA }}

      - name: Sync RSS into Firestore
        run: bash scripts/fetch-episodes-rss.sh
        env:
          RSS_TRIGGER_KEY_FILE: ${{ runner.temp }}/rss-trigger-sa.json

      - name: Clean up RSS credential file
        if: always()
        run: rm -f "${RUNNER_TEMP}/rss-trigger-sa.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Outside the checkout, deliberately: this job runs `git commit` and
      # pushes to a public repo, and a private key in the working tree is one
      # `git add -A` away from publication.
      - name: Write Firestore export service account key
        run: echo "${FIRESTORE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firestore-sa.json"
        env:
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}

      - name: Export episodes and open a protected update PR if changed
        run: bash update_episodes.sh
        env:
          FIRESTORE_CREDENTIALS: ${{ runner.temp }}/firestore-sa.json
          GH_TOKEN: ${{ github.token }}
          EPISODE_UPDATE_BRANCH: automation/episode-update-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Clean up credential file
        if: always()
        run: rm -f "${RUNNER_TEMP}/firestore-sa.json"
