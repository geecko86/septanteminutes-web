name: Update episodes & deploy

on:
  schedule:
    # Runs hourly; the guard job only lets it proceed every 3 hours in
    # Europe/Brussels local time (DST-aware), 10 minutes after
    # fetch-episodes-rss.yml's equivalent guard.
    # Months are here as well as in the guard so July and August schedule
    # nothing at all. Cron is evaluated in UTC, so the guard still owns the
    # month boundary — the last hours of 30 June are already July in Brussels.
    - cron: '30 * * 1-6,9-12 *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          read -r month hour <<< "$(TZ='Europe/Brussels' date '+%m %H')"
          # The show does not publish over the summer, so there is nothing to
          # export. workflow_dispatch still runs — see the job condition below.
          if [ "$month" = "07" ] || [ "$month" = "08" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Summer break — no episodes expected in month $month."
          elif [ $((10#$hour % 3)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update-episodes:
    needs: guard
    if: github.event_name == 'workflow_dispatch' || needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Outside the checkout, deliberately: this job runs `git commit` and
      # pushes to a public repo, and a private key in the working tree is one
      # `git add -A` away from publication.
      - name: Write Firestore export service account key
        run: echo "${FIRESTORE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firestore-sa.json"
        env:
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}

      - name: Write Firebase Hosting deploy service account key
        run: echo "${FIREBASE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Fetch episodes, build and deploy if changed
        run: bash update_episodes.sh
        env:
          FIRESTORE_CREDENTIALS: ${{ runner.temp }}/firestore-sa.json
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          GH_TOKEN: ${{ github.token }}
          STORYBOARD_PROXY_TOKEN: ${{ secrets.STORYBOARD_PROXY_TOKEN }}
          STORYBOARD_PROXY_URL: ${{ secrets.STORYBOARD_PROXY_URL }}

      - name: Clean up credential files
        if: always()
        run: rm -f "${RUNNER_TEMP}/firestore-sa.json" "${RUNNER_TEMP}/firebase-sa.json"
