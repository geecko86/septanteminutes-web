name: Update episodes & deploy

on:
  schedule:
    # Paired with fetch-episodes-rss.yml's explicit UTC schedules. The guard
    # selects the schedule matching Brussels' current DST offset and does not
    # reject a valid job merely because GitHub started it in a later hour.
    - cron: '30 1,4,7,10,13,16,19,22 * 1-6,9-12 *' # CEST (UTC+2)
    - cron: '30 2,5,8,11,14,17,20,23 * 1-6,9-12 *' # CET (UTC+1)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: episode-update
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          read -r month offset <<< "$(TZ='Europe/Brussels' date '+%m %z')"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$month" = "07" ] || [ "$month" = "08" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Summer break — no episodes expected in month $month."
          elif { [ "$offset" = "+0200" ] && [ "$SCHEDULE" = "30 1,4,7,10,13,16,19,22 * 1-6,9-12 *" ]; } || \
               { [ "$offset" = "+0100" ] && [ "$SCHEDULE" = "30 2,5,8,11,14,17,20,23 * 1-6,9-12 *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring the schedule for the other Brussels UTC offset ($offset)."
          fi

  update-episodes:
    needs: guard
    if: github.event_name == 'workflow_dispatch' || needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # Push the update branch and create its PR as the repository App. Unlike
      # GITHUB_TOKEN, App-authored events start CI and downstream workflows.
      - name: Mint an episode update token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Outside the checkout, deliberately: this job runs `git commit` and
      # pushes to a public repo, and a private key in the working tree is one
      # `git add -A` away from publication.
      - name: Write Firestore export service account key
        run: echo "${FIRESTORE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firestore-sa.json"
        env:
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}

      - name: Export episodes and open a protected update PR if changed
        run: bash update_episodes.sh
        env:
          FIRESTORE_CREDENTIALS: ${{ runner.temp }}/firestore-sa.json
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUES_GH_TOKEN: ${{ github.token }}
          EPISODE_UPDATE_BRANCH: automation/episode-update-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Clean up credential file
        if: always()
        run: rm -f "${RUNNER_TEMP}/firestore-sa.json"
