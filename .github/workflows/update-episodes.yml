name: Update episodes & deploy

on:
  schedule:
    # Runs hourly; the guard job only lets it proceed every 3 hours in
    # Europe/Brussels local time (DST-aware), 10 minutes after
    # fetch-episodes-rss.yml's equivalent guard.
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          hour=$(TZ='Europe/Brussels' date +%H)
          if [ $((10#$hour % 3)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update-episodes:
    needs: guard
    if: github.event_name == 'workflow_dispatch' || needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install yarn
        run: npm install -g yarn@1.22.22

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Write Firestore export service account key
        run: echo "${FIRESTORE_SERVICE_ACCOUNT}" > septanteminutes-a0cde5efbc25.json
        env:
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}

      - name: Write Firebase Hosting deploy service account key
        run: echo "${FIREBASE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Fetch episodes, build and deploy if changed
        run: bash update_episodes.sh
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          GH_TOKEN: ${{ github.token }}
          STORYBOARD_PROXY_TOKEN: ${{ secrets.STORYBOARD_PROXY_TOKEN }}
          STORYBOARD_PROXY_URL: ${{ secrets.STORYBOARD_PROXY_URL }}

      - name: Clean up credential files
        if: always()
        run: rm -f septanteminutes-a0cde5efbc25.json "${RUNNER_TEMP}/firebase-sa.json"
